name: Bug report
description: Something in MAKU doesn't work as it should (one bug per issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible bugs (one per issue). Ideas and questions: open a plain issue and say so in the title.
  - type: input
    id: version
    attributes:
      label: MAKU version
      description: HOME + OCT- (settings menu) > ABOUT on the FM-1, or the file name of the package
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the installer or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo or short video helps.
    validations:
      required: true
