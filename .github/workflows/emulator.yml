name: Emulator (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow fonttools
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      # generated headers only (fonts, icons, tables, samples); the firmware toolchain is not needed
      - name: Generate headers
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - name: Build the emulator
        run: sh web/emu/build.sh
      - name: Check it boots
        run: node web/emu/emu_test.mjs
        continue-on-error: true
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r build/emu/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
